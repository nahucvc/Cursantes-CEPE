# Listener con TLS (puerto 8883)
listener 8883
protocol mqtt

cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key

# Listener SIN TLS (puerto 1883)
listener 1883
protocol mqtt
# no se especifican cafile/certfile/keyfile => comunicación en claro

# Autenticación y control de acceso (aplica a todos los listeners)
allow_anonymous false
password_file /mosquitto/config/password.txt
# opcional: acl_file /mosquitto/config/aclfile.txt
